[project]
name = "ourcompass-backend"
version = "0.1.0"
description = "OurCompass - AI career masterplan service backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.7",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "argon2-cffi>=23.1",
    "pillow>=10.0",
    "anthropic>=0.116",
    "firebase-admin>=7.5",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100
# Autogenerated migration files keep alembic's own template style.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: line length. B008: FastAPI's Depends-in-default idiom.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# env.py must import models after sys.path/config setup.
"alembic/env.py" = ["E402", "I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Fixtures AND tests share one session-scoped loop: the lazily-created async
# engine must never be touched from two different event loops (asyncpg breaks).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]